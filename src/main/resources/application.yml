# Default profile = PROD-SAFE. Local dev uses application-local.yml (profile=local, gitignored).
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/crm-demo}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:P4ssword!}
    hikari:
      # Neon Free is serverless with a small connection budget (max ~97 usable).
      # Keep the pool tiny; the pooled (-pooler) host handles multiplexing.
      maximum-pool-size: ${SPRING_DATASOURCE_POOL_SIZE:3}
      minimum-idle: 0
      connection-timeout: 10000
      max-lifetime: 280000
      data-source-properties:
        # PgBouncer (transaction mode) + server-side prepared statements =
        # "cached plan must not change result type" whenever DDL runs while
        # another instance holds cached plans (e.g. overlapping Render deploys
        # with ddl-auto: update). Disabling server prepares avoids it entirely;
        # negligible cost at demo traffic. (Phase 1 Flyway + validate removes
        # runtime DDL for good.)
        prepareThreshold: 0
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway (src/main/resources/db/migration). Hibernate
      # never touches DDL at runtime — it only validates the mapping.
      # The existing prod database (created by ddl-auto:update) is baselined at
      # V1 via flyway.baseline-on-migrate below; fresh DBs migrate V1 -> V2.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  docker:
    compose:
      lifecycle-management: start-only
  jackson:
    serialization:
      write-dates-as-timestamps: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
info:
  app:
    name: crm-demo
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://bachi.dev,https://bachidev.github.io,http://localhost:4200}
error:
  handling:
    http-status-in-json-response: true
    exception-logging: NO_LOGGING
    full-stacktrace-http-statuses: 5xx
    log-levels:
      5xx: ERROR
    codes:
      CampaignLeadStatusValid: CAMPAIGN_LEAD_STATUS_VALID
springdoc:
  pathsToMatch: /api/**
