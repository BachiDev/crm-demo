# Default profile = PROD-SAFE. Local dev uses application-local.yml (profile=local, gitignored).
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/crm-demo}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:P4ssword!}
    hikari:
      # Neon Free is serverless with a small connection budget (max ~97 usable).
      # Keep the pool tiny; the pooled (-pooler) host handles multiplexing.
      maximum-pool-size: ${SPRING_DATASOURCE_POOL_SIZE:3}
      minimum-idle: 0
      connection-timeout: 10000
      max-lifetime: 280000
  jpa:
    defer-datasource-initialization: true
    open-in-view: false
    hibernate:
      # NOTE: 'update' bootstraps a fresh Neon DB non-destructively on first connect.
      # Phase 1 switches to Flyway + 'validate'. Never use create-drop outside local.
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  docker:
    compose:
      lifecycle-management: start-only
  jackson:
    serialization:
      write-dates-as-timestamps: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
info:
  app:
    name: crm-demo
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://bachi.dev,https://bachidev.github.io,http://localhost:4200}
error:
  handling:
    http-status-in-json-response: true
    exception-logging: NO_LOGGING
    full-stacktrace-http-statuses: 5xx
    log-levels:
      5xx: ERROR
    codes:
      CampaignLeadStatusValid: CAMPAIGN_LEAD_STATUS_VALID
springdoc:
  pathsToMatch: /api/**
