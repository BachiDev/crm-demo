<div class="flex flex-wrap mb-6">
    <h1 class="grow text-3xl md:text-4xl font-medium mb-2" i18n="@@campaignLead.edit.headline">Edit Campaign Lead</h1>
    <div>
        <a routerLink="/campaignLeads" class="inline-block text-white bg-gray-500 hover:bg-gray-600 focus:ring-gray-200 focus:ring-4 rounded px-5 py-2" i18n="@@campaignLead.edit.back">Back to list</a>
    </div>
</div>
<form [formGroup]="editForm" (ngSubmit)="handleSubmit()">
    <app-input-row [group]="editForm" field="status" i18n-label="@@campaignLead.status.label" label="Status" />
    <app-input-row [group]="editForm" field="createdAt" i18n-label="@@campaignLead.createdAt.label" label="Created At" />
    <app-input-row [group]="editForm" field="campaign" rowType="select" [options]="campaignValues" i18n-label="@@campaignLead.campaign.label" label="Campaign" />
    <app-input-row [group]="editForm" field="contact" rowType="select" [options]="contactValues" i18n-label="@@campaignLead.contact.label" label="Contact" />
    <input type="submit" i18n-value="@@campaignLead.edit.headline" value="Edit Campaign Lead" class="inline-block text-white bg-blue-600 hover:bg-blue-700 focus:ring-blue-300  focus:ring-4 rounded px-5 py-2 cursor-pointer mt-6" />
</form>
