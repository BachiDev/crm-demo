<div class="flex flex-wrap mb-6">
    <h1 class="grow text-3xl md:text-4xl font-medium mb-2" i18n="@@activity.add.headline">Add Activity</h1>
    <div>
        <a routerLink="/activities" class="inline-block text-white bg-gray-500 hover:bg-gray-600 focus:ring-gray-200 focus:ring-4 rounded px-5 py-2" i18n="@@activity.add.back">Back to list</a>
    </div>
</div>
<form [formGroup]="addForm" (ngSubmit)="handleSubmit()">
    <app-input-row [group]="addForm" field="activityType" i18n-label="@@activity.activityType.label" label="Activity Type" />
    <app-input-row [group]="addForm" field="subject" i18n-label="@@activity.subject.label" label="Subject" />
    <app-input-row [group]="addForm" field="dueDate" i18n-label="@@activity.dueDate.label" label="Due Date" />
    <app-input-row [group]="addForm" field="status" i18n-label="@@activity.status.label" label="Status" />
    <app-input-row [group]="addForm" field="owner" rowType="select" [options]="ownerValues" i18n-label="@@activity.owner.label" label="Owner" />
    <input type="submit" i18n-value="@@activity.add.headline" value="Add Activity" class="inline-block text-white bg-blue-600 hover:bg-blue-700 focus:ring-blue-300  focus:ring-4 rounded px-5 py-2 cursor-pointer mt-6" />
</form>
