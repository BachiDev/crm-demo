<div class="flex flex-wrap mb-6">
    <h1 class="grow text-3xl md:text-4xl font-medium mb-2" i18n="@@activity.edit.headline">Edit Activity</h1>
    <div>
        <a routerLink="/activities" class="inline-block text-white bg-gray-500 hover:bg-gray-600 focus:ring-gray-200 focus:ring-4 rounded px-5 py-2" i18n="@@activity.edit.back">Back to list</a>
    </div>
</div>
<form [formGroup]="editForm" (ngSubmit)="handleSubmit()">
    <app-input-row [group]="editForm" field="activityId" i18n-label="@@activity.activityId.label" label="Activity Id" />
    <app-input-row [group]="editForm" field="activityType" i18n-label="@@activity.activityType.label" label="Activity Type" />
    <app-input-row [group]="editForm" field="subject" i18n-label="@@activity.subject.label" label="Subject" />
    <app-input-row [group]="editForm" field="dueDate" i18n-label="@@activity.dueDate.label" label="Due Date" />
    <app-input-row [group]="editForm" field="status" i18n-label="@@activity.status.label" label="Status" />
    <app-input-row [group]="editForm" field="owner" rowType="select" [options]="ownerValues" i18n-label="@@activity.owner.label" label="Owner" />
    <input type="submit" i18n-value="@@activity.edit.headline" value="Edit Activity" class="inline-block text-white bg-violet-600 hover:bg-violet-500 rounded-full px-5 py-2 cursor-pointer mt-6 font-medium" />
</form>
