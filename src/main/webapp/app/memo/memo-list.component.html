<app-page-header i18n-title="@@memo.list.headline" title="Memos" [count]="totalElements" i18n-countLabel="@@memo.list.count" countLabel="memos total"
                createLink="/memos/add" i18n-createLabel="@@memo.list.createNew" createLabel="Create new Memo" />

<div class="mb-4 flex justify-end">
    <app-search-input class="w-full max-w-xs" i18n-placeholder="@@memo.search" placeholder="Search text or type…" (search)="onSearch($event)" />
</div>

@if (loading) {
<div class="overflow-x-auto rounded-2xl border border-zinc-200 bg-white" aria-busy="true" aria-label="Loading memos">
    <div class="space-y-2 p-4">
        <div class="h-10 animate-pulse rounded-lg bg-zinc-100"></div>
        <div class="h-10 animate-pulse rounded-lg bg-zinc-100"></div>
        <div class="h-10 animate-pulse rounded-lg bg-zinc-100"></div>
    </div>
</div>
} @else if (memoes.length === 0) {
<app-empty-state i18n-title="@@memo.list.empty" [title]="q ? 'No memos match your search' : 'No memos found'"
                 i18n-hint="@@memo.list.emptyHint" hint="Write the first memo to get started."
                 actionLink="/memos/add" i18n-actionLabel="@@memo.list.createNew" actionLabel="Create new Memo" />
} @else {
<div class="overflow-x-auto rounded-2xl border border-zinc-200 bg-white">
    <table class="w-full text-sm">
        <caption class="sr-only" i18n="@@memo.list.caption">Memos attached to accounts and contacts</caption>
        <thead>
            <tr class="text-left text-xs uppercase tracking-wide text-zinc-500">
                <th scope="col" class="p-3 font-medium" i18n="@@memo.relatedToType.label">Related To Type</th>
                <th scope="col" class="p-3 font-medium" i18n="@@memo.relatedToId.label">Related To</th>
                <th scope="col" class="p-3 font-medium" i18n="@@memo.memoText.label">Memo</th>
                <th scope="col" class="p-3 font-medium" i18n="@@memo.memoId.label">Id</th>
                <th><span class="sr-only" i18n="@@list.actions">Actions</span></th>
            </tr>
        </thead>
        <tbody>
            @for (memo of memoes; track memo.memoId) {
            <tr class="border-t border-zinc-100 hover:bg-brand-50/50">
                <td class="p-3"><app-status-pill [value]="memo.relatedToType || '–'" tone="violet" /></td>
                <td class="p-3 font-mono text-xs text-zinc-500" [title]="memo.relatedToId">{{ shortId(memo.relatedToId) }}</td>
                <td class="p-3 max-w-md truncate text-zinc-600" [title]="memo.memoText">{{ memo.memoText }}</td>
                <td class="p-3 font-mono text-xs text-zinc-500" [title]="memo.memoId">{{ shortId(memo.memoId) }}</td>
                <td class="p-3">
                    <div class="float-right flex gap-1.5 whitespace-nowrap">
                        <a [routerLink]="['/memos/edit', memo.memoId]" class="inline-block rounded-full border border-zinc-300 px-3 py-1.5 text-xs font-medium hover:bg-zinc-100" i18n="@@memo.list.edit">Edit</a>
                        <button type="button" (click)="requestDelete(memo.memoId!)" class="inline-block cursor-pointer rounded-full bg-rose-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-rose-500" i18n="@@memo.list.delete">Delete</button>
                    </div>
                </td>
            </tr>
            }
        </tbody>
    </table>
</div>
<app-pagination [page]="page" [totalPages]="totalPages" [totalElements]="totalElements ?? 0" [pageSize]="pageSize"
                (pageChange)="onPage($event)" (pageSizeChange)="onPageSize($event)">memos</app-pagination>
}

<app-confirm-dialog i18n-title="@@delete.title" title="Delete this record?"
                    i18n-message="@@delete.confirm" message="Do you really want to delete this element? This cannot be undone."
                    (confirmed)="deleteConfirmed()" />
