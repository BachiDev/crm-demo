<div class="flex flex-wrap mb-6">
    <h1 class="grow text-3xl md:text-4xl font-medium mb-2" i18n="@@campaign.add.headline">Add Campaign</h1>
    <div>
        <a routerLink="/campaigns" class="inline-block text-white bg-gray-500 hover:bg-gray-600 focus:ring-gray-200 focus:ring-4 rounded px-5 py-2" i18n="@@campaign.add.back">Back to list</a>
    </div>
</div>
<form [formGroup]="addForm" (ngSubmit)="handleSubmit()">
    <app-input-row [group]="addForm" field="campaignName" i18n-label="@@campaign.campaignName.label" label="Campaign Name" />
    <app-input-row [group]="addForm" field="campaignType" i18n-label="@@campaign.campaignType.label" label="Campaign Type" />
    <app-input-row [group]="addForm" field="startDate" i18n-label="@@campaign.startDate.label" label="Start Date" />
    <app-input-row [group]="addForm" field="endDate" i18n-label="@@campaign.endDate.label" label="End Date" />
    <app-input-row [group]="addForm" field="status" i18n-label="@@campaign.status.label" label="Status" />
    <app-input-row [group]="addForm" field="owner" rowType="select" [options]="ownerValues" i18n-label="@@campaign.owner.label" label="Owner" />
    <input type="submit" i18n-value="@@campaign.add.headline" value="Add Campaign" class="inline-block text-white bg-violet-600 hover:bg-violet-500 rounded-full px-5 py-2 cursor-pointer mt-6 font-medium" />
</form>
