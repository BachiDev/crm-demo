<div class="flex flex-wrap mb-6">
    <h1 class="grow text-3xl md:text-4xl font-medium mb-2" i18n="@@product.edit.headline">Edit Product</h1>
    <div>
        <a routerLink="/products" class="inline-block text-white bg-gray-500 hover:bg-gray-600 focus:ring-gray-200 focus:ring-4 rounded px-5 py-2" i18n="@@product.edit.back">Back to list</a>
    </div>
</div>
<form [formGroup]="editForm" (ngSubmit)="handleSubmit()">
    <app-input-row [group]="editForm" field="productId" i18n-label="@@product.productId.label" label="Product Id" />
    <app-input-row [group]="editForm" field="productName" i18n-label="@@product.productName.label" label="Product Name" />
    <app-input-row [group]="editForm" field="sku" i18n-label="@@product.sku.label" label="Sku" />
    <app-input-row [group]="editForm" field="price" i18n-label="@@product.price.label" label="Price" />
    <app-input-row [group]="editForm" field="description" rowType="textarea" i18n-label="@@product.description.label" label="Description" />
    <input type="submit" i18n-value="@@product.edit.headline" value="Edit Product" class="inline-block text-white bg-violet-600 hover:bg-violet-500 rounded-full px-5 py-2 cursor-pointer mt-6 font-medium" />
</form>
