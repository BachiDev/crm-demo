name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend (Gradle check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check (compile + tests)
        run: ./gradlew check --no-daemon

  frontend:
    name: Frontend (npm ci + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Must match local dev (Node 24 / npm 11): the lockfile is npm-11
          # generated and older npm versions reject it in `npm ci`.
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Unit tests (headless Chrome)
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:ci
      - name: Build production
        run: npm run build
      # Phase 3 adds: lint, test:ci (Karma headless + coverage), Playwright smoke.

  deploy-frontend:
    name: Frontend (deploy to Pages)    if: github.ref == 'refs/heads/master'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Must match local dev (Node 24 / npm 11) — see frontend job.
          node-version: '24'
          cache: npm
      - run: npm ci
      # Builds (production, base-href /crm-demo/) and force-pushes the output
      # to the gh-pages branch, which GitHub Pages serves at
      # https://bachi.dev/crm-demo/ (Pages source: gh-pages branch).
      - name: Deploy to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # angular-cli-ghpages clones fresh without credentials; inject the token.
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          npx ng deploy

  e2e:
    name: E2E (Playwright smoke)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      # Consumed by docker-compose (started automatically by Spring Boot);
      # never points at production (profile=local, see playwright.config.ts).
      POSTGRES_PASSWORD: playwright-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
